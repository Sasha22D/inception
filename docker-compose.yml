services:
  nginx:
    image: nginx:1.0
    ports:
      - 80:80
    volumes:
      - wordpress_volume:/var/www/html/wordpress
    depends_on:
      - wordpress
  wordpress:
    image: wordpress:1.0
    environment:
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_USER_PASS=$DB_USER_PASS
      - DB_HOST=$DB_HOST
    volumes:
      - wordpress_volume:/var/www/html/wordpress
    depends_on:
      - mariadb
  mariadb:
    image: mariadb:1.0
    environment:
      - DB_ROOT_PASS=$DB_ROOT_PASS
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_USER_PASS=$DB_USER_PASS
    volumes:
      - maria_volume:/var/lib/mysql
volumes:
  maria_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sadaniel/data/mariadb_vol
  wordpress_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sadaniel/data/wordpress_vol
