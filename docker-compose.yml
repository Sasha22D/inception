services:
  nginx:
    image: nginx:1.0
    ports:
      - 80:80
  wordpress:
    image: wordpress:1.0
    environment:
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_USER_PASS=$DB_USER_PASS
      - DB_HOST=$DB_HOST
  mariadb:
    image: mariadb:1.0
    environment:
      - DB_ROOT_PASS=$DB_ROOT_PASS
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_USER_PASS=$DB_USER_PASS
    volumes:
      - db_maria:/var/lib/mysql
volumes:
  db_maria:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sadaniel/data
